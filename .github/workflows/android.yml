name: Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage

  e2e:
    name: E2E (Playwright, mobile emulation)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  debug-apk:
    # Independent of lint/tests: a testable APK (and Gradle build feedback) on every push.
    name: Debug APK
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      # Debug builds always use Google's test ad units (src/config.ts defaults).
      - run: npm run build
        env:
          VITE_APP_VERSION: 0.0.${{ github.run_number }}-debug
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PversionCode=${{ github.run_number }} -PversionName=0.0.${{ github.run_number }}-debug
      - uses: actions/upload-artifact@v4
        with:
          name: press-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release-aab:
    name: Signed release AAB
    runs-on: ubuntu-latest
    needs: [checks, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      VITE_ADS_MODE: production
      VITE_ADMOB_REWARDED_ID: ${{ secrets.VITE_ADMOB_REWARDED_ID }}
      VITE_ADMOB_INTERSTITIAL_ID: ${{ secrets.VITE_ADMOB_INTERSTITIAL_ID }}
      VITE_ADMOB_TEST_DEVICES: ${{ secrets.VITE_ADMOB_TEST_DEVICES }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check release secrets
        run: |
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v (see docs/RELEASE.md)"; exit 1; fi
          done
          for v in ADMOB_APP_ID VITE_ADMOB_REWARDED_ID VITE_ADMOB_INTERSTITIAL_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing production ad secret $v (see docs/RELEASE.md)"; exit 1; fi
          done
          # App ID uses "~", ad units use "/": a swap would crash the app on launch.
          [[ "$ADMOB_APP_ID" =~ ^ca-app-pub-[0-9]{16}~[0-9]{10}$ ]] || { echo "::error::ADMOB_APP_ID must look like ca-app-pub-0000000000000000~0000000000"; exit 1; }
          for v in VITE_ADMOB_REWARDED_ID VITE_ADMOB_INTERSTITIAL_ID; do
            [[ "${!v}" =~ ^ca-app-pub-[0-9]{16}/[0-9]{10}$ ]] || { echo "::error::$v must look like ca-app-pub-0000000000000000/0000000000"; exit 1; }
          done
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: npm ci
      - name: Build web bundle (version from tag)
        run: VITE_APP_VERSION="${GITHUB_REF_NAME#v}" npm run build
      - name: Guard — no Google test ad IDs in a production web bundle
        run: |
          if grep -rq "ca-app-pub-3940256099942544" dist/; then
            echo "::error::Release bundle still contains Google's TEST publisher id"; exit 1
          fi
      - run: npx cap sync android
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/press-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/press-upload.jks" >> "$GITHUB_ENV"
      - name: Bundle release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew bundleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName="$VERSION"
      - name: Guard — manifest uses the production AdMob app id
        run: |
          unzip -p android/app/build/outputs/bundle/release/app-release.aab base/manifest/AndroidManifest.xml > /tmp/manifest.pb || true
          if grep -aq "ca-app-pub-3940256099942544" /tmp/manifest.pb; then
            echo "::error::Release AAB manifest still has the TEST AdMob app id"; exit 1
          fi
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/press-upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: press-release-${{ github.ref_name }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90
